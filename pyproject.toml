[project]
name = "deepsignsecure"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "saiyogeshgopisetti", email = "yogeshgopisetty46@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-bcrypt>=1.0.1",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "numpy>=2.4.6",
    "opencv-python>=5.1.0.95",
    "streamlit>=1.67.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
deepsignsecure = "deepsignsecure:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
